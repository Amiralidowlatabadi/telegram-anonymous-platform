[project]
name = "telegram-anonymous-platform"
version = "1.0.0"
description = "Production-Ready Dual-Mode Telegram Anonymous Platform"
authors = [{ name = "Architect & Security Lead" }]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.17.0",
    "sqlalchemy[asyncio]>=2.0.38",
    "asyncpg>=0.30.0",
    "alembic>=1.14.1",
    "redis[hiredis]>=5.2.1",
    "pydantic-settings>=2.7.1",
    "structlog>=25.1.0",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "pytest-mock>=3.14.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]